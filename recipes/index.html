<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipes</title>
    
    <!-- Open Graph (Facebook, LinkedIn, etc.) -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Your Title">
    <meta property="og:description" content="Your Description">
    <meta property="og:url" content="Your URL">
    <meta property="og:image" content="social-preview-image.png">

    <!-- X Card -->
    <meta name="twitter:card" content="Social Preview Image">
    <meta name="twitter:title" content="Your Title">
    <meta name="twitter:description" content="Your Description">
    <meta name="twitter:image" content="social-preview-image.png">

    <!-- One favicon (ICO works everywhere) -->
    <link rel="icon" href="/favicon.ico">

    <!-- One Apple Touch Icon (iOS home screen) -->
    <link rel="apple-touch-icon" href="images/apple-crisp-img.jpg">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&family=Tinos:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">

    <!-- Css link -->
    <link rel="stylesheet" href="recipes.css">
                    
</head>
<body>
    <header id="site-header">
        <img src="images/recipe-book-img.png" alt="Recipe Icon" id="recipe-icon">
        <span>RECIPEBOOK</span>
    </header>
    <div id="search-bar">
        <input type="text" placeholder="Find a recipe" id="search-input" img-src="images/search-img.svg">
        <img src="images/search-img.svg" alt="search icon" id="search-icon">
    </div>
    <div id="recipe-card">
        <img src="images/apple-crisp-img.jpg" alt="Apple Crisp" id="apple-img">
        <div id="tag">
            <p>DESSERT</p>
        </div>
        <h1>Apple Crisp</h1>
        <span
        class="rating"
        role="img"
        aria-label="Rating: 4 out of 5 stars"
        >
            <span aria-hidden="true" class="icon-star">⭐</span>
            <span aria-hidden="true" class="icon-star">⭐</span>
            <span aria-hidden="true" class="icon-star">⭐</span>
            <span aria-hidden="true" class="icon-star">⭐</span>
            <span aria-hidden="true" class="icon-star-empty">☆</span>
        </span>
    </div>
</body>
<footer>
    <div class="social">
        <!-- Social media icons provided under CC from https://www.iconfinder.com/AlfredoCreates  -->
        <a href="#"><img src="images/instagram_icon-img.svg" alt="instagram icon"></a>
        <a href="#"><img src="images/youtube_icon-img.svg" alt="youtube icon"></a>
        <a href="#"><img src="images/pinterest_icon-img.svg" alt="pinterest icon"></a>
    </div>
    <a href="https://www.flaticon.com/free-icons/recipe" title="recipe icons">Recipe icons created by Freepik - Flaticon</a>
</footer>
</html>
